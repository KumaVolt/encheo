# cargo-about: the licences of the Rust crates compiled into Encheo (scripts/notices.sh).
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause",
    "BSD-3-Clause", "0BSD", "ISC", "Zlib", "Unicode-3.0", "Unlicense", "BSL-1.0", "CC0-1.0",
    "CDLA-Permissive-2.0", "MPL-2.0", "LGPL-2.1", "LGPL-2.1-or-later",
    "LicenseRef-Slint-Royalty-free-2.0",
]
# The platforms Encheo is released for.
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu", "aarch64-linux-android", "aarch64-apple-ios",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# Slint's crates keep their licence in LICENSES/, which cargo-about doesn't read: its text is in
# licenses/Slint-Royalty-free-2.0.md and listed in THIRD-PARTY-NOTICES.md.
