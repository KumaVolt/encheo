name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Commit new README screenshots (docs/screenshots) to this branch
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used to commit screenshots when asked to
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p encheo
      - name: Package
        run: |
          mkdir -p dist/encheo
          cp target/release/encheo dist/encheo/
          cp README.md LICENSE dist/encheo/
          cp apps/encheo/notices.txt dist/encheo/THIRD-PARTY-NOTICES.txt
          tar -C dist -czf encheo-linux-x86_64.tar.gz encheo
      - uses: actions/upload-artifact@v4
        with:
          name: encheo-linux-x86_64
          path: encheo-linux-x86_64.tar.gz
      # The README's screenshots: the app on a pretend Plex server with a made-up library, in a
      # virtual display. Attached to every run; committed when the workflow is run by hand with
      # update-screenshots.
      - name: Screenshots
        # Never holds up a build or a release.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends xvfb python3-pil libgl1-mesa-dri
          rm -rf docs/screenshots
          xvfb-run -a -s "-screen 0 1920x1200x24" env SLINT_SCALE_FACTOR=1.5 \
            scripts/screenshots/run.sh target/release/encheo docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: encheo-screenshots
          path: docs/screenshots
      - name: Commit screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.update-screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet || { git commit -m "README screenshots" && git push; }

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Community Windows builds of mpv; the dev package has libmpv-2.dll and headers.
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" --dir mpv-dl
          $archive = Get-ChildItem mpv-dl\*.7z | Select-Object -First 1
          7z x $archive.FullName -ompv | Out-Null
          # Which build ships, for its licence (GPL) and source: see THIRD-PARTY-NOTICES.md.
          "libmpv-2.dll is from $($archive.Name), https://github.com/shinchiro/mpv-winbuild-cmake/releases" | Set-Content mpv\libmpv-build.txt
          # MSVC needs an import library; build one from the DLL's exports.
          $exports = dumpbin /exports mpv\libmpv-2.dll | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(mpv_\w+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "LIBRARY libmpv-2.dll`nEXPORTS`n" + ($exports -join "`n") | Set-Content mpv\mpv.def
          lib /nologo /def:mpv\mpv.def /machine:x64 /out:mpv\mpv.lib
          "MPV_LIB_DIR=$PWD\mpv" | Out-File -Append $env:GITHUB_ENV
          "$PWD\mpv" | Out-File -Append $env:GITHUB_PATH
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p encheo
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist\encheo | Out-Null
          Copy-Item target\release\encheo.exe, mpv\libmpv-2.dll, mpv\libmpv-build.txt, README.md, LICENSE dist\encheo\
          Copy-Item apps\encheo\notices.txt dist\encheo\THIRD-PARTY-NOTICES.txt
          Compress-Archive dist\encheo encheo-windows-x86_64.zip
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist\encheo" "/O$PWD" packaging\windows\encheo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: encheo-windows-x86_64
          path: |
            encheo-windows-x86_64.zip
            encheo-windows-x86_64-setup.exe

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p encheo
      # iOS: an unsigned .ipa for sideloading. libmpv from MPVKit, cached.
      - uses: actions/cache@v4
        with:
          path: apps/encheo/ios-libs
          key: ios-libs-${{ hashFiles('scripts/ios-libs.sh') }}
      - run: scripts/ios-libs.sh && rm -rf apps/encheo/ios-libs/zips
      - run: rustup target add aarch64-apple-ios && scripts/ios.sh ipa
      - name: Package
        run: |
          APP=dist/Encheo.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp packaging/macos/Encheo.icns "$APP/Contents/Resources/"
          cp target/release/encheo "$APP/Contents/MacOS/Encheo"
          cp apps/encheo/notices.txt "$APP/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Encheo</string>
            <key>CFBundleIdentifier</key><string>app.encheo</string>
            <key>CFBundleExecutable</key><string>Encheo</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>Encheo</string>
            <key>CFBundleShortVersionString</key><string>$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --sign - "$APP"
          ditto -c -k --keepParent "$APP" encheo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: encheo-macos-arm64
          path: encheo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: encheo-ios
          path: target/ios/encheo-ios.ipa

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tools
        run: |
          cargo install cargo-ndk --locked
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
      - name: libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/android-libs.sh
      # Android ships through Google Play, so this only checks that it builds: nothing is signed
      # or uploaded, and releases carry no APK.
      - name: Build
        run: scripts/android.sh release

  # On a version tag: attach every platform's build to a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The README screenshots are an artifact too; they aren't downloads.
          rm -f dist/*.png
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Encheo ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --prerelease
