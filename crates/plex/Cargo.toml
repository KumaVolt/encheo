[package]
name = "encheo-plex"
description = "Plex client: PIN sign-in, server discovery, libraries, playback URLs, progress"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "gzip", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

# Android: verify TLS against bundled Mozilla roots; the system verifier needs Java glue.
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
