[package]
name = "encheo-vfs"
description = "File sources for Encheo: local folders, SMB, WebDAV, SFTP, FTP and NFS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
encheo-plex = { version = "0.2.0", path = "../plex" }
nfs3_client = { version = "0.9.1", features = ["tokio"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
russh = "0.64.1"
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
smb2 = "0.35.0"
suppaftp = { version = "12.2.1", features = ["rustls-ring"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "rt-multi-thread", "sync"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[dev-dependencies]
nfs3_server = { version = "0.11.1", features = ["memfs"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
