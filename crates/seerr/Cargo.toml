[package]
name = "encheo-seerr"
description = "Seerr (Overseerr, Jellyseerr) client: sign-in, search, request status with download progress, requests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encheo-plex = { version = "0.6.0", path = "../plex" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
