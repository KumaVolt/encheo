[package]
name = "encheo-jellyfin"
description = "Jellyfin and Emby client for Encheo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
encheo-plex = { version = "0.3.0", path = "../plex" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
